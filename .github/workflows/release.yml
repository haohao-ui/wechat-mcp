name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: 构建 macOS 通用二进制并发布
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 敏感信息检查
        run: scripts/check_sensitive.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: 测试
        run: cargo test --locked
      - name: 构建 Rust（arm64 + x86_64）
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: 打包通用二进制
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          OUT="wechat-mcp-${VERSION}-macos-universal"
          mkdir -p "dist/$OUT"
          lipo -create -output "dist/$OUT/wechat-mcp" \
            target/aarch64-apple-darwin/release/wechat-mcp \
            target/x86_64-apple-darwin/release/wechat-mcp
          for t in wechat_ocr wechat_window; do
            swiftc -O -target arm64-apple-macos13 native/$t.swift -o "/tmp/$t-arm64"
            swiftc -O -target x86_64-apple-macos13 native/$t.swift -o "/tmp/$t-x86_64"
            lipo -create -output "dist/$OUT/$t" "/tmp/$t-arm64" "/tmp/$t-x86_64"
          done
          swiftc -O -target arm64-apple-macos13 native/click/main.swift native/common/*.swift native/action/*.swift -o /tmp/wechat_click-arm64
          swiftc -O -target x86_64-apple-macos13 native/click/main.swift native/common/*.swift native/action/*.swift -o /tmp/wechat_click-x86_64
          lipo -create -output "dist/$OUT/wechat_click" /tmp/wechat_click-arm64 /tmp/wechat_click-x86_64
          swiftc -O -parse-as-library -target arm64-apple-macos13 native/wechat_bubbles.swift native/common/*.swift native/eyes/*.swift -o /tmp/wechat_bubbles-arm64
          swiftc -O -parse-as-library -target x86_64-apple-macos13 native/wechat_bubbles.swift native/common/*.swift native/eyes/*.swift -o /tmp/wechat_bubbles-x86_64
          lipo -create -output "dist/$OUT/wechat_bubbles" /tmp/wechat_bubbles-arm64 /tmp/wechat_bubbles-x86_64
          swiftc -O -parse-as-library -D BOT_WORKER -target arm64-apple-macos12 native/wechat_bubbles.swift native/common/*.swift native/eyes/*.swift native/action/*.swift native/bot/*.swift -o /tmp/wechat_bot_worker-arm64
          swiftc -O -parse-as-library -D BOT_WORKER -target x86_64-apple-macos12 native/wechat_bubbles.swift native/common/*.swift native/eyes/*.swift native/action/*.swift native/bot/*.swift -o /tmp/wechat_bot_worker-x86_64
          lipo -create -output "dist/$OUT/wechat_bot_worker" /tmp/wechat_bot_worker-arm64 /tmp/wechat_bot_worker-x86_64
          swiftc -O -target arm64-apple-macos13 native/overlay/main.swift -o /tmp/wechat_overlay-arm64
          swiftc -O -target x86_64-apple-macos13 native/overlay/main.swift -o /tmp/wechat_overlay-x86_64
          lipo -create -output "dist/$OUT/wechat_overlay" /tmp/wechat_overlay-arm64 /tmp/wechat_overlay-x86_64
          swiftc -O -parse-as-library -target arm64-apple-macos13 native/macos/*.swift -o /tmp/wechat_runtime-arm64
          swiftc -O -parse-as-library -target x86_64-apple-macos13 native/macos/*.swift -o /tmp/wechat_runtime-x86_64
          lipo -create -output "dist/$OUT/wechat_runtime" /tmp/wechat_runtime-arm64 /tmp/wechat_runtime-x86_64
          cp README.md gateway.example.json "dist/$OUT/"
          cp -R skills "dist/$OUT/"
          cp -R native/layout "dist/$OUT/"
          tar -C dist -czf "dist/$OUT.tar.gz" "$OUT"
          (cd dist && shasum -a 256 "$OUT.tar.gz" > "$OUT.tar.gz.sha256")
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
