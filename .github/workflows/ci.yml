name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action 在 pull_request 事件里要列出 PR 的提交；
  # 缺少该权限时它直接抛 "Resource not accessible by integration"（403），
  # 会被误报成密钥泄露。push 事件不需要，但多给一个只读权限无副作用。
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  security:
    name: 敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 本机路径 / 个人信息 / 禁止文件检查
        run: scripts/check_sensitive.sh
      - name: gitleaks 密钥扫描（含历史）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell 脚本检查
        run: |
          for f in scripts/*.sh scripts/hooks/*; do bash -n "$f"; done
          shellcheck -S warning scripts/*.sh scripts/hooks/*
      - name: 禁止 Python 回归
        run: bash scripts/test-gates.sh

  test:
    name: 构建与测试 (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # 暂不检查 src/interaction.rs，避免与进行中的通用桌面交互会话冲突；该会话提交后恢复为 cargo fmt --all -- --check
      - name: cargo fmt
        run: rustfmt --edition 2024 --check $(git ls-files '*.rs' | grep -v '^src/interaction.rs$')
      - name: cargo clippy
        run: cargo clippy --all-targets --locked
      - name: cargo test
        run: cargo test --locked
      - name: 交叉编译检查
        run: |
          cargo check --locked --target aarch64-apple-darwin
          cargo check --locked --target x86_64-apple-darwin
      - name: 编译原生工具
        run: |
          mkdir -p target/native
          for t in wechat_ocr wechat_window; do
            swiftc native/$t.swift -o target/native/$t
          done
          swiftc -target "$(uname -m)-apple-macos12" native/interaction/*.swift native/common/Geometry.swift native/action/*.swift -o target/native/desktop_helper
          swiftc native/click/*.swift native/common/*.swift native/action/*.swift -o target/native/wechat_click
          swiftc native/overlay/main.swift -o target/native/wechat_overlay
          target/native/wechat_overlay --self-test
          swiftc -parse-as-library native/wechat_bubbles.swift native/common/*.swift native/eyes/*.swift -o target/native/wechat_bubbles
          swiftc -target "$(uname -m)-apple-macos12" -parse-as-library -D BOT_WORKER native/wechat_bubbles.swift native/common/*.swift native/eyes/*.swift native/action/*.swift native/bot/*.swift -o target/native/wechat_bot_worker
          target/native/wechat_window --self-test
          swiftc -parse-as-library native/macos/*.swift -o target/native/wechat_runtime
          target/native/wechat_runtime --self-test
      - name: 安装脚本测试（隔离 HOME）
        run: bash scripts/test-install.sh
