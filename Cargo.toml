[package]
name = "wechat-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
anyhow = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
uuid = { version = "1.26.1", features = ["v4"] }
fs2 = "0.4.3"
scraper = "0.27"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
unicode-normalization = "0.1.26"
sha2 = "0.11.1"
serde_json_canonicalizer = "=0.3.2"
libc = "=0.2.189"
ring = { version = "=0.17.14", default-features = false }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.46", default-features = false }

[lib]
name = "wechat_mcp"
path = "src/lib.rs"

[[bin]]
name = "wechat-mcp"
path = "src/main.rs"

[[bin]]
name = "wechat-updater"
path = "src/bin/wechat-updater.rs"

[[bin]]
name = "wechat-test-signer"
path = "src/bin/wechat-test-signer.rs"

[[bin]]
name = "wechat-release-signer"
path = "src/bin/wechat-release-signer.rs"

[lints.clippy]
correctness = "deny"
suspicious = "deny"
style = "warn"
complexity = "warn"
perf = "warn"
pedantic = "warn"

